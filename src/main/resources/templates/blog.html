<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{nav.blog})}"></head>
  <body>
    <header th:replace="~{fragments/site :: header('blog')}"></header>
    <main class="site-container section-space">
      <div class="page-heading">
        <p class="eyebrow section-number" th:text="#{section.journal}"></p>
        <h1 th:text="#{home.journal}"></h1>
        <p th:text="#{blog.intro}"></p>
      </div>
      <p
        class="empty-state"
        th:if="${postsPage.empty}"
        th:text="#{blog.empty}"
      ></p>
      <div class="journal-grid">
        <article class="journal-item" th:each="post : ${postsPage.content}">
          <a
            th:if="${!#strings.isEmpty(post.coverImageUrl)}"
            th:href="@{/blog/{slug}(slug=${post.slug})}"
            ><img
              class="journal-cover"
              th:src="@{'/' + ${post.coverImageUrl}}"
              th:alt="${@portfolioText.title(post,#locale)}"
              loading="lazy"
          /></a>
          <p
            class="work-meta"
            th:text="${#temporals.format(post.publishedAt,'dd MMMM yyyy')}"
          ></p>
          <h2>
            <a
              th:href="@{/blog/{slug}(slug=${post.slug})}"
              th:text="${@portfolioText.title(post,#locale)}"
            ></a>
          </h2>
          <p th:text="${@portfolioText.excerpt(post,#locale)}"></p>
          <a class="text-link" th:href="@{/blog/{slug}(slug=${post.slug})}"
            ><span th:text="#{action.read}"></span
            ><span aria-hidden="true">↗</span></a
          >
        </article>
      </div>
      <nav
        class="blog-pages"
        th:if="${postsPage.totalPages > 1}"
        th:aria-label="#{blog.pages}"
      >
        <a
          th:if="${!postsPage.first}"
          th:href="@{/blog(page=${postsPage.number - 1})}"
          th:text="#{action.previous}"
        ></a>
        <a
          th:each="i : ${#numbers.sequence(0,postsPage.totalPages - 1)}"
          th:href="@{/blog(page=${i})}"
          th:classappend="${i == postsPage.number} ? 'active'"
          th:text="${i + 1}"
          th:attr="aria-current=${i == postsPage.number} ? 'page' : null"
        ></a>
        <a
          th:if="${!postsPage.last}"
          th:href="@{/blog(page=${postsPage.number + 1})}"
          th:text="#{action.next}"
        ></a>
      </nav>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
  </body>
</html>
