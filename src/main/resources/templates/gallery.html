<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{nav.gallery})}"></head>
  <body>
    <header th:replace="~{fragments/site :: header('gallery')}"></header>
    <main class="site-container section-space">
      <div class="page-heading">
        <p class="eyebrow section-number" th:text="#{section.collection}"></p>
        <h1 th:text="#{nav.gallery}"></h1>
        <p th:text="#{gallery.intro}"></p>
      </div>
      <nav class="gallery-filters" th:aria-label="#{gallery.filters}">
        <a
          th:href="@{/gallery}"
          th:classappend="${activeCategory == null and activeYear == null} ? 'active'"
          th:text="#{gallery.all}"
        ></a>
        <a
          th:each="cat : ${categories}"
          th:href="@{/gallery(category=${cat.slug})}"
          th:text="${@portfolioText.term(cat.name,#locale)}"
          th:classappend="${activeCategory == cat.slug} ? 'active'"
        ></a>
        <a
          th:each="y : ${years}"
          th:href="@{/gallery(year=${y})}"
          th:text="${y}"
          th:classappend="${activeYear == y} ? 'active'"
        ></a>
      </nav>
      <p
        th:if="${#lists.isEmpty(artworks)}"
        class="empty-state"
        th:text="#{gallery.empty}"
      ></p>
      <div class="work-grid">
        <th:block th:each="artwork : ${artworks}"
          ><article
            th:replace="~{fragments/site :: artworkCard(${artwork})}"
          ></article
        ></th:block>
      </div>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
  </body>
</html>
