<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{action.order})}"></head>
  <body>
    <header th:replace="~{fragments/site :: header('gallery')}"></header>
    <main class="site-container section-space">
      <div class="order-layout">
        <section>
          <p class="eyebrow section-number" th:text="#{order.eyebrow}"></p>
          <h1 th:text="#{order.title}"></h1>
          <div class="order-artwork">
            <img
              th:if="${!#strings.isEmpty(artwork.imageUrl)}"
              th:src="@{'/' + ${artwork.imageUrl}}"
              th:alt="${@portfolioText.title(artwork,#locale)}"
            />
            <h2 th:text="${@portfolioText.title(artwork,#locale)}"></h2>
            <p th:if="${artwork.price != null}">
              <span th:text="${artwork.price}"></span>
              <span th:text="#{currency}"></span>
            </p>
          </div>
        </section>
        <form
          class="form-section"
          th:action="@{/order/{id}(id=${artwork.id})}"
          th:object="${order}"
          method="post"
        >
          <div class="form-field">
            <label for="customerName" th:text="#{field.name}"></label>
            <input
              id="customerName"
              class="form-control"
              type="text"
              th:field="*{customerName}"
              required
              th:classappend="${#fields.hasErrors('customerName')} ? 'is-invalid'"
            />
            <div class="invalid-feedback" th:errors="*{customerName}"></div>
          </div>
          <div class="form-field">
            <label for="customerEmail" th:text="#{field.email}"></label>
            <input
              id="customerEmail"
              class="form-control"
              type="email"
              th:field="*{customerEmail}"
              required
              th:classappend="${#fields.hasErrors('customerEmail')} ? 'is-invalid'"
            />
            <div class="invalid-feedback" th:errors="*{customerEmail}"></div>
          </div>
          <div class="form-field">
            <label for="customerPhone" th:text="#{field.phone}"></label>
            <input
              id="customerPhone"
              class="form-control"
              type="tel"
              th:field="*{customerPhone}"
              th:classappend="${#fields.hasErrors('customerPhone')} ? 'is-invalid'"
            />
            <div class="invalid-feedback" th:errors="*{customerPhone}"></div>
          </div>
          <div class="form-field">
            <label for="message" th:text="#{field.message}"></label>
            <textarea
              id="message"
              class="form-control"
              rows="5"
              th:field="*{message}"
              th:classappend="${#fields.hasErrors('message')} ? 'is-invalid'"
            ></textarea>
            <div class="invalid-feedback" th:errors="*{message}"></div>
          </div>
          <div class="form-actions">
            <button
              type="submit"
              class="button button-accent"
              th:text="#{order.submit}"
            ></button
            ><a
              class="text-link"
              th:href="@{/gallery/{id}(id=${artwork.id})}"
              th:text="#{action.cancel}"
            ></a>
          </div>
        </form>
      </div>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
  </body>
</html>
