<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head
    th:replace="~{fragments/site :: head(${@portfolioText.title(artwork,#locale)})}"
  ></head>
  <body>
    <header th:replace="~{fragments/site :: header('gallery')}"></header>
    <main class="site-container section-space">
      <a class="text-link back-link" th:href="@{/gallery}"
        ><span aria-hidden="true">←</span
        ><span th:text="#{action.gallery}"></span
      ></a>
      <div class="artwork-detail">
        <div class="detail-image">
          <a
            class="image-preview-trigger"
            data-image-preview
            th:if="${!#strings.isEmpty(artwork.imageUrl)}"
            th:href="@{'/' + ${artwork.imageUrl}}"
            th:title="#{viewer.open}"
            th:aria-label="#{viewer.open}"
          >
            <img
              th:src="@{'/' + ${artwork.imageUrl}}"
              th:alt="${@portfolioText.title(artwork,#locale)}"
            />
            <span class="preview-icon" aria-hidden="true"
              ><i data-lucide="expand"></i
            ></span>
          </a>
          <span
            class="image-missing"
            th:unless="${!#strings.isEmpty(artwork.imageUrl)}"
            th:text="#{image.none}"
          ></span>
        </div>
        <section class="detail-copy">
          <p class="eyebrow section-number" th:text="${artwork.year}"></p>
          <h1 th:text="${@portfolioText.title(artwork,#locale)}"></h1>
          <p class="availability">
            <span
              class="availability-dot"
              th:classappend="${!artwork.available} ? 'sold'"
            ></span
            ><span
              th:text="${artwork.available} ? #{artwork.available} : #{artwork.sold}"
            ></span>
          </p>
          <p class="price" th:if="${artwork.price != null}">
            <span th:text="${artwork.price}"></span>
            <span th:text="#{currency}"></span>
          </p>
          <dl class="artwork-facts">
            <div th:if="${!#strings.isEmpty(artwork.material)}">
              <dt th:text="#{field.material}"></dt>
              <dd
                th:text="${@portfolioText.term(artwork.material,#locale)}"
              ></dd>
            </div>
            <div th:if="${!#strings.isEmpty(artwork.surface)}">
              <dt th:text="#{field.surface}"></dt>
              <dd
                th:text="${@portfolioText.term(artwork.surface,#locale)}"
              ></dd>
            </div>
            <div th:if="${!#strings.isEmpty(artwork.genre)}">
              <dt th:text="#{field.genre}"></dt>
              <dd th:text="${@portfolioText.term(artwork.genre,#locale)}"></dd>
            </div>
            <div
              th:if="${artwork.widthCm != null and artwork.heightCm != null}"
            >
              <dt th:text="#{field.dimensions}"></dt>
              <dd>
                <span
                  th:text="${artwork.widthCm + ' × ' + artwork.heightCm}"
                ></span>
                <span th:text="#{unit.cm}"></span>
              </dd>
            </div>
          </dl>
          <div
            class="artwork-story"
            th:if="${!#strings.isEmpty(@portfolioText.description(artwork,#locale))}"
          >
            <h2 th:text="#{artwork.about}"></h2>
            <p th:text="${@portfolioText.description(artwork,#locale)}"></p>
          </div>
          <a
            th:if="${artwork.available}"
            th:href="@{/order/{id}(id=${artwork.id})}"
            class="button button-accent"
            ><span th:text="#{action.order}"></span
            ><span aria-hidden="true">→</span></a
          >
        </section>
      </div>
    </main>
    <dialog class="image-viewer" aria-labelledby="viewer-caption">
      <form method="dialog">
        <button
          class="viewer-close"
          autofocus
          th:title="#{viewer.close}"
          th:aria-label="#{viewer.close}"
        >
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </form>
      <img
        class="viewer-image"
        th:alt="${@portfolioText.title(artwork,#locale)}"
      />
      <p
        id="viewer-caption"
        th:text="${@portfolioText.title(artwork,#locale)}"
      ></p>
    </dialog>
    <script th:src="@{/js/vendor/lucide.min.js}" defer></script>
    <footer th:replace="~{fragments/site :: footer}"></footer>
  </body>
</html>
