<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{nav.contact})}"></head>
  <body>
    <header th:replace="~{fragments/site :: header('contact')}"></header>
    <main class="site-container section-space">
      <div class="contact-layout">
        <section class="contact-intro">
          <p class="eyebrow section-number" th:text="#{section.contact}"></p>
          <h1 th:text="#{contact.title}"></h1>
          <p th:text="#{contact.intro}"></p>
          <div class="contact-rule"></div>
          <p class="contact-note" th:text="#{contact.note}"></p>
          <div class="social-placeholders">
            <button
              th:each="social : ${socialNames}"
              type="button"
              disabled
              th:title="#{social.pending}"
              th:aria-label="${social + ': ' + #messages.msg('social.pending')}"
            >
              <img
                th:src="@{'/images/social/' + ${social} + '.svg'}"
                alt=""
              /><span th:text="${#strings.capitalize(social)}"></span>
            </button>
          </div>
        </section>
        <section class="form-section">
          <div
            th:if="${success}"
            class="alert alert-success"
            role="status"
            th:text="#{contact.success}"
          ></div>
          <form
            th:action="@{/contact}"
            th:object="${contactForm}"
            method="post"
            th:unless="${success}"
          >
            <div class="form-field">
              <label for="name" th:text="#{field.name}"></label>
              <input
                id="name"
                class="form-control"
                type="text"
                th:field="*{name}"
                required
                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
              />
              <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="form-field">
              <label for="email" th:text="#{field.email}"></label>
              <input
                id="email"
                class="form-control"
                type="email"
                th:field="*{email}"
                required
                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
              />
              <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="form-field">
              <label for="message" th:text="#{field.message}"></label>
              <textarea
                id="message"
                class="form-control"
                rows="5"
                th:field="*{message}"
                required
                th:classappend="${#fields.hasErrors('message')} ? 'is-invalid'"
              ></textarea>
              <div class="invalid-feedback" th:errors="*{message}"></div>
            </div>
            <button class="button button-accent" type="submit">
              <span th:text="#{action.send}"></span
              ><span aria-hidden="true">→</span>
            </button>
          </form>
          <a
            th:if="${success}"
            class="text-link"
            th:href="@{/gallery}"
            th:text="#{action.gallery}"
          ></a>
        </section>
      </div>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
  </body>
</html>
