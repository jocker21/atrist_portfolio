<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{admin.orders})}"></head>
  <body class="admin-page">
    <nav th:replace="~{fragments/site :: adminHeader}"></nav>
    <main class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
          <span th:text="#{admin.orders}"></span> #<span
            th:text="${order.id}"
          ></span>
        </h1>
        <a
          class="btn btn-outline-dark"
          th:href="@{/admin/orders}"
          th:text="#{action.previous}"
        ></a>
      </div>
      <div class="row g-5">
        <section class="col-md-6">
          <h2 th:text="#{field.buyer}"></h2>
          <p th:text="${order.customerName}"></p>
          <p th:text="${order.customerEmail}"></p>
          <p th:text="${order.customerPhone}"></p>
          <h2 th:text="#{field.message}"></h2>
          <p th:text="${order.message}"></p>
        </section>
        <section class="col-md-6">
          <h2 th:text="#{field.artwork}"></h2>
          <p th:text="${@portfolioText.title(order.artwork,#locale)}"></p>
          <p th:if="${order.artwork.price != null}">
            <span th:text="${order.artwork.price}"></span>
            <span th:text="#{currency}"></span>
          </p>
          <form
            th:action="@{/admin/orders/{id}/status(id=${order.id})}"
            method="post"
            class="mb-4"
          >
            <label
              for="status"
              class="form-label"
              th:text="#{field.status}"
            ></label
            ><select class="form-select mb-3" name="status" id="status">
              <option
                th:each="status : ${T(com.example.artist.entity.Order.OrderStatus).values()}"
                th:value="${status}"
                th:selected="${status == order.status}"
                th:text="${#messages.msg('status.' + status.name())}"
              ></option></select
            ><button
              class="btn btn-dark"
              type="submit"
              th:text="#{action.save}"
            ></button>
          </form>
          <form
            th:action="@{/admin/orders/{id}/delete(id=${order.id})}"
            method="post"
            th:attr="data-confirm=#{confirm.order}"
          >
            <button
              class="btn btn-outline-danger"
              type="submit"
              th:text="#{action.delete}"
            ></button>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
