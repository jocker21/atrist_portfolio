<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Замовлення | Адмінка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/orders}">Замовлення</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/artworks}">Картини</a>
            <a class="nav-link" th:href="@{/admin/blog}">Блог</a>
            <a class="nav-link active" th:href="@{/admin/orders}">Замовлення</a>
            <a class="nav-link" th:href="@{/gallery}">Сайт</a>
        </div>
    </div>
</nav>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="'Замовлення #' + ${order.id}">Замовлення</h1>
        <a th:href="@{/admin/orders}" class="btn btn-outline-dark">Назад</a>
    </div>

    <div class="row g-4">
        <div class="col-md-7">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Покупець</h2>
                    <p class="mb-1"><strong>Ім'я:</strong> <span th:text="${order.customerName}"></span></p>
                    <p class="mb-1"><strong>Email:</strong> <span th:text="${order.customerEmail}"></span></p>
                    <p class="mb-3"><strong>Телефон:</strong> <span th:text="${order.customerPhone ?: '—'}"></span></p>

                    <h2 class="h5 mb-2">Повідомлення</h2>
                    <p class="mb-0" th:text="${order.message ?: '—'}"></p>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Картина</h2>
                    <p class="mb-1"><strong>Назва:</strong> <span th:text="${order.artwork.title}"></span></p>
                    <p class="mb-3"><strong>Ціна:</strong>
                        <span th:text="${order.artwork.price != null ? order.artwork.price + ' грн' : '—'}"></span>
                    </p>

                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="mb-3">
                        <label class="form-label" for="status">Статус</label>
                        <div class="d-flex gap-2">
                            <select id="status" name="status" class="form-select">
                                <option th:each="status : ${T(com.example.artist.entity.Order.OrderStatus).values()}"
                                        th:value="${status}"
                                        th:selected="${status == order.status}"
                                        th:text="${status}"></option>
                            </select>
                            <button type="submit" class="btn btn-dark">Зберегти</button>
                        </div>
                    </form>

                    <form th:action="@{/admin/orders/{id}/delete(id=${order.id})}"
                          method="post"
                          onsubmit="return confirm('Видалити замовлення?')">
                        <button type="submit" class="btn btn-outline-danger">Видалити</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
