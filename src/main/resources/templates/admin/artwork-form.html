<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{admin.newArtwork})}"></head>
  <body class="admin-page">
    <nav th:replace="~{fragments/site :: adminHeader}"></nav>
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h1
            class="mb-4"
            th:text="${artwork.id != null} ? #{admin.editArtwork} : #{admin.newArtwork}"
          ></h1>
          <form
            th:action="${artwork.id != null} ? @{/admin/artworks/{id}/edit(id=${artwork.id})} : @{/admin/artworks/new}"
            th:object="${artwork}"
            method="post"
            enctype="multipart/form-data"
            data-media-form
          >
            <p
              th:if="${mediaError != null}"
              class="alert alert-danger"
              role="alert"
              th:text="#{${mediaError}}"
            ></p>
            <p
              th:if="${uploadsMustReselect == true}"
              class="alert alert-warning"
              th:text="#{media.reselect}"
            ></p>
            <div class="mb-3">
              <label
                class="form-label"
                for="title"
                th:text="#{field.title}"
              ></label
              ><input
                type="text"
                class="form-control"
                id="title"
                th:field="*{title}"
                required
                th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
              />
              <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label
                    class="form-label"
                    for="year"
                    th:text="#{field.year}"
                  ></label
                  ><input
                    type="number"
                    class="form-control"
                    id="year"
                    min="1900"
                    max="2099"
                    th:field="*{year}"
                    required
                    th:classappend="${#fields.hasErrors('year')} ? 'is-invalid'"
                  />
                  <div class="invalid-feedback" th:errors="*{year}"></div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label
                    class="form-label"
                    for="price"
                    th:text="#{price.uah}"
                  ></label
                  ><input
                    type="number"
                    class="form-control"
                    id="price"
                    min="0.01"
                    step="0.01"
                    th:field="*{price}"
                    th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                  />
                  <div class="invalid-feedback" th:errors="*{price}"></div>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label
                for="priceUsd"
                class="form-label"
                th:text="#{price.usd}"
              ></label>
              <input
                type="number"
                id="priceUsd"
                th:field="*{priceUsd}"
                min="0.01"
                step="0.01"
                class="form-control"
                th:classappend="${#fields.hasErrors('priceUsd')} ? 'is-invalid'"
              />
              <div class="invalid-feedback" th:errors="*{priceUsd}"></div>
            </div>
            <div class="mb-3">
              <label
                for="inputUnit"
                class="form-label"
                th:text="#{measure.units}"
              ></label>
              <select
                id="inputUnit"
                name="inputUnit"
                class="form-select"
                data-input-unit
              >
                <option
                  value="cm"
                  th:selected="${inputUnit != 'in'}"
                  th:text="#{measure.cm}"
                ></option>
                <option
                  value="in"
                  th:selected="${inputUnit == 'in'}"
                  th:text="#{measure.in}"
                ></option>
              </select>
            </div>
            <div class="mb-3">
              <label
                class="form-label"
                for="genre"
                th:text="#{field.genre}"
              ></label
              ><select class="form-select" id="genre" th:field="*{genre}">
                <option value="" th:text="#{admin.choose}"></option>
                <option
                  th:each="term : ${@artworkTerms.options('genre')}"
                  th:value="${term.value}"
                  th:text="${@artworkTerms.label('genre',term.value,#locale)}"
                ></option>
              </select>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label
                    class="form-label"
                    for="material"
                    th:text="#{field.material}"
                  ></label
                  ><select
                    class="form-select"
                    id="material"
                    th:field="*{material}"
                  >
                    <option value="" th:text="#{admin.choose}"></option>
                    <option
                      th:each="term : ${@artworkTerms.options('material')}"
                      th:value="${term.value}"
                      th:text="${@artworkTerms.label('material',term.value,#locale)}"
                    ></option>
                  </select>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label
                    class="form-label"
                    for="surface"
                    th:text="#{field.surface}"
                  ></label
                  ><select
                    class="form-select"
                    id="surface"
                    th:field="*{surface}"
                  >
                    <option value="" th:text="#{admin.choose}"></option>
                    <option
                      th:each="term : ${@artworkTerms.options('surface')}"
                      th:value="${term.value}"
                      th:text="${@artworkTerms.label('surface',term.value,#locale)}"
                    ></option>
                  </select>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label
                    class="form-label"
                    for="widthCm"
                    th:text="#{field.width}"
                  ></label
                  ><input
                    type="number"
                    class="form-control"
                    id="widthCm"
                    min="0.01"
                    step="0.01"
                    th:field="*{widthCm}"
                    th:classappend="${#fields.hasErrors('widthCm')} ? 'is-invalid'"
                  />
                  <div class="invalid-feedback" th:errors="*{widthCm}"></div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label
                    class="form-label"
                    for="heightCm"
                    th:text="#{field.height}"
                  ></label
                  ><input
                    type="number"
                    class="form-control"
                    id="heightCm"
                    min="0.01"
                    step="0.01"
                    th:field="*{heightCm}"
                    th:classappend="${#fields.hasErrors('heightCm')} ? 'is-invalid'"
                  />
                  <div class="invalid-feedback" th:errors="*{heightCm}"></div>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label
                class="form-label"
                for="description"
                th:text="#{field.description}"
              ></label
              ><textarea
                rows="5"
                class="form-control"
                id="description"
                th:field="*{description}"
                th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
              ></textarea>
              <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>
            <section class="translation-fields">
              <h2 th:text="#{admin.english}"></h2>
              <div class="mb-3">
                <label
                  class="form-label"
                  for="titleEn"
                  th:text="#{admin.titleEn}"
                ></label
                ><input
                  type="text"
                  class="form-control"
                  id="titleEn"
                  th:field="*{titleEn}"
                  th:classappend="${#fields.hasErrors('titleEn')} ? 'is-invalid'"
                />
                <div class="invalid-feedback" th:errors="*{titleEn}"></div>
              </div>
              <div class="mb-3">
                <label
                  class="form-label"
                  for="descriptionEn"
                  th:text="#{admin.descriptionEn}"
                ></label
                ><textarea
                  rows="5"
                  class="form-control"
                  id="descriptionEn"
                  th:field="*{descriptionEn}"
                  th:classappend="${#fields.hasErrors('descriptionEn')} ? 'is-invalid'"
                ></textarea>
                <div
                  class="invalid-feedback"
                  th:errors="*{descriptionEn}"
                ></div>
              </div>
            </section>
            <fieldset class="mb-4">
              <legend class="form-label" th:text="#{field.technique}"></legend>
              <select
                class="form-select"
                id="technique"
                th:field="*{technique}"
                th:aria-label="#{field.technique}"
              >
                <option value="" th:text="#{admin.choose}"></option>
                <option
                  th:each="term : ${@artworkTerms.options('technique')}"
                  th:value="${term.value}"
                  th:text="${@artworkTerms.label('technique',term.value,#locale)}"
                ></option>
              </select>
            </fieldset>
            <fieldset class="mb-4">
              <legend class="form-label" th:text="#{field.categories}"></legend>
              <div class="d-flex flex-wrap gap-3">
                <div class="form-check" th:each="cat : ${categories}">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    name="categoryIds"
                    th:id="${'category-' + cat.id}"
                    th:value="${cat.id}"
                    th:checked="${selectedCategoryIds != null ? selectedCategoryIds.contains(cat.id) : (artwork.categories != null and artwork.categories.contains(cat))}"
                  /><label
                    class="form-check-label"
                    th:for="${'category-' + cat.id}"
                    th:text="${@portfolioText.term(cat.name,#locale)}"
                  ></label>
                </div>
              </div>
            </fieldset>
            <div class="mb-4">
              <label
                class="form-label"
                for="imageFile"
                th:text="#{field.image}"
              ></label>
              <div th:if="${artwork.imageUrl}" class="mb-3">
                <img
                  th:src="@{'/' + ${artwork.imageUrl}}"
                  th:alt="${artwork.title}"
                  style="max-height: 180px"
                />
              </div>
              <input
                id="imageFile"
                name="imageFile"
                type="file"
                accept="image/jpeg,image/png"
                class="form-control"
              />
            </div>
            <fieldset class="artwork-media-editor mb-4">
              <legend th:text="#{media.photos}"></legend>
              <div class="media-thumbnails admin-media-thumbnails">
                <label
                  class="media-edit-photo"
                  th:each="photo, stat : ${artwork.additionalImages}"
                >
                  <img
                    th:src="@{'/' + ${photo}}"
                    th:alt="#{media.photoNumber(${stat.count})}"
                    loading="lazy"
                  />
                  <span
                    ><input
                      type="checkbox"
                      name="removePhotos"
                      th:value="${photo}" />
                    <span th:text="#{media.remove}"></span
                  ></span>
                </label>
              </div>
              <label
                for="additionalPhotos"
                class="form-label"
                th:text="#{media.addPhotos}"
              ></label>
              <input
                class="form-control"
                type="file"
                id="additionalPhotos"
                name="additionalPhotos"
                multiple
                accept="image/jpeg,image/png"
                th:attr="data-existing=${#lists.size(artwork.additionalImages)},data-count-error=#{media.tooMany},data-size-error=#{media.imageSize},data-remove-label=#{media.remove}"
              />
              <p class="media-limits" th:text="#{media.photoLimits}"></p>
              <div
                class="media-thumbnails pending-photos"
                aria-live="polite"
              ></div>
            </fieldset>
            <fieldset class="artwork-media-editor mb-4">
              <legend th:text="#{media.video}"></legend>
              <div th:if="${artwork.videoUrl != null}">
                <video
                  controls
                  preload="metadata"
                  playsinline
                  class="admin-media-video"
                  th:src="@{'/' + ${artwork.videoUrl}}"
                ></video>
                <label class="form-check-label"
                  ><input type="checkbox" name="removeVideo" value="true" />
                  <span th:text="#{media.removeVideo}"></span
                ></label>
              </div>
              <label
                for="videoFile"
                class="form-label"
                th:text="${artwork.videoUrl != null} ? #{media.replaceVideo} : #{media.addVideo}"
              ></label>
              <input
                class="form-control"
                type="file"
                id="videoFile"
                name="videoFile"
                accept="video/mp4"
                th:attr="data-size-error=#{media.videoSize}"
              />
              <p class="media-limits" th:text="#{media.videoLimits}"></p>
              <video
                controls
                preload="metadata"
                playsinline
                class="admin-media-video pending-video"
                hidden
              ></video>
            </fieldset>
            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                id="available"
                th:field="*{available}"
              /><label
                class="form-check-label"
                for="available"
                th:text="#{admin.available}"
              ></label>
            </div>
            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                id="published"
                th:field="*{published}"
              /><label
                class="form-check-label"
                for="published"
                th:text="#{admin.publishArtwork}"
              ></label>
            </div>
            <div class="d-flex gap-3 mt-4">
              <button
                class="btn btn-dark"
                type="submit"
                th:text="#{action.save}"
              ></button
              ><a
                class="btn btn-outline-secondary"
                th:href="@{/admin/artworks}"
                th:text="#{action.cancel}"
              ></a>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script th:src="@{/js/vendor/lucide.min.js}" defer></script>
  </body>
</html>
