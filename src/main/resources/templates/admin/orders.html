<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{admin.orders})}"></head>
  <body class="admin-page">
    <nav th:replace="~{fragments/site :: adminHeader}"></nav>
    <main class="container my-5">
      <h1 class="mb-4" th:text="#{admin.orders}"></h1>
      <p
        th:if="${orders.isEmpty()}"
        class="text-muted"
        th:text="#{admin.emptyOrders}"
      ></p>
      <div th:unless="${orders.isEmpty()}" class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th th:text="#{field.buyer}"></th>
              <th th:text="#{field.artwork}"></th>
              <th th:text="#{field.phone}"></th>
              <th th:text="#{field.status}"></th>
              <th th:text="#{field.date}"></th>
              <th th:text="#{field.actions}"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="order : ${orders}">
              <td th:text="${order.id}"></td>
              <td>
                <div th:text="${order.customerName}"></div>
                <small th:text="${order.customerEmail}"></small>
              </td>
              <td th:text="${@portfolioText.title(order.artwork,#locale)}"></td>
              <td th:text="${order.customerPhone}"></td>
              <td
                th:text="${#messages.msg('status.' + order.status.name())}"
              ></td>
              <td
                th:text="${#temporals.format(order.createdAt,'dd.MM.yyyy HH:mm')}"
              ></td>
              <td>
                <a
                  class="btn btn-sm btn-outline-dark"
                  th:href="@{/admin/orders/{id}(id=${order.id})}"
                  th:text="#{action.view}"
                ></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
