<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{admin.artworks})}"></head>
  <body class="admin-page">
    <nav th:replace="~{fragments/site :: adminHeader}"></nav>
    <main class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="#{admin.artworks}"></h1>
        <a
          class="btn btn-dark"
          th:href="@{/admin/artworks/new}"
          th:text="#{admin.newArtwork}"
        ></a>
      </div>
      <div class="table-responsive">
        <table class="table align-middle table-hover">
          <thead>
            <tr>
              <th th:text="#{field.image}"></th>
              <th th:text="#{field.title}"></th>
              <th th:text="#{field.year}"></th>
              <th th:text="#{field.material}"></th>
              <th th:text="#{field.published}"></th>
              <th th:text="#{field.actions}"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="artwork : ${artworks}">
              <td>
                <img
                  th:if="${artwork.imageUrl}"
                  th:src="@{'/' + ${artwork.imageUrl}}"
                  th:alt="${artwork.title}"
                  style="width: 60px; height: 70px; object-fit: contain"
                />
              </td>
              <td th:text="${@portfolioText.title(artwork,#locale)}"></td>
              <td th:text="${artwork.year}"></td>
              <td
                th:text="${@portfolioText.term(artwork.material,#locale)}"
              ></td>
              <td
                th:text="${artwork.published} ? #{admin.yes} : #{admin.no}"
              ></td>
              <td>
                <div class="d-flex gap-2">
                  <a
                    class="btn btn-sm btn-outline-dark"
                    th:href="@{/admin/artworks/{id}/edit(id=${artwork.id})}"
                    th:text="#{action.edit}"
                  ></a>
                  <form
                    th:action="@{/admin/artworks/{id}/delete(id=${artwork.id})}"
                    method="post"
                    th:attr="data-confirm=#{confirm.artwork}"
                  >
                    <button
                      class="btn btn-sm btn-outline-danger"
                      type="submit"
                      th:text="#{action.delete}"
                    ></button>
                  </form>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(artworks)}">
              <td
                colspan="6"
                class="text-muted py-4"
                th:text="#{admin.emptyWorks}"
              ></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
