<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{admin.newPost})}"></head>
  <body class="admin-page">
    <nav th:replace="~{fragments/site :: adminHeader}"></nav>
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <h1
            class="mb-4"
            th:text="${post.id != null} ? #{admin.editPost} : #{admin.newPost}"
          ></h1>
          <form
            th:action="${post.id != null} ? @{/admin/blog/{id}/edit(id=${post.id})} : @{/admin/blog/new}"
            th:object="${post}"
            method="post"
          >
            <div class="mb-3">
              <label
                class="form-label"
                for="title"
                th:text="#{field.title}"
              ></label
              ><input
                type="text"
                class="form-control"
                id="title"
                th:field="*{title}"
                required
                th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
              />
              <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>
            <div class="mb-3">
              <label
                class="form-label"
                for="slug"
                th:text="#{admin.slug}"
              ></label
              ><input
                type="text"
                class="form-control"
                id="slug"
                th:field="*{slug}"
                th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid'"
              />
              <div class="invalid-feedback" th:errors="*{slug}"></div>
            </div>
            <div class="mb-3">
              <label
                class="form-label"
                for="excerpt"
                th:text="#{admin.excerpt}"
              ></label
              ><textarea
                rows="5"
                class="form-control"
                id="excerpt"
                th:field="*{excerpt}"
                th:classappend="${#fields.hasErrors('excerpt')} ? 'is-invalid'"
              ></textarea>
              <div class="invalid-feedback" th:errors="*{excerpt}"></div>
            </div>
            <div class="mb-3">
              <label
                class="form-label"
                for="content"
                th:text="#{admin.content}"
              ></label
              ><textarea
                rows="5"
                class="form-control"
                id="content"
                th:field="*{content}"
                required
                th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
              ></textarea>
              <div class="invalid-feedback" th:errors="*{content}"></div>
            </div>
            <section class="translation-fields">
              <h2 th:text="#{admin.english}"></h2>
              <div class="mb-3">
                <label
                  class="form-label"
                  for="titleEn"
                  th:text="#{admin.titleEn}"
                ></label
                ><input
                  type="text"
                  class="form-control"
                  id="titleEn"
                  th:field="*{titleEn}"
                  th:classappend="${#fields.hasErrors('titleEn')} ? 'is-invalid'"
                />
                <div class="invalid-feedback" th:errors="*{titleEn}"></div>
              </div>
              <div class="mb-3">
                <label
                  class="form-label"
                  for="excerptEn"
                  th:text="#{admin.excerptEn}"
                ></label
                ><textarea
                  rows="5"
                  class="form-control"
                  id="excerptEn"
                  th:field="*{excerptEn}"
                  th:classappend="${#fields.hasErrors('excerptEn')} ? 'is-invalid'"
                ></textarea>
                <div class="invalid-feedback" th:errors="*{excerptEn}"></div>
              </div>
              <div class="mb-3">
                <label
                  class="form-label"
                  for="contentEn"
                  th:text="#{admin.contentEn}"
                ></label
                ><textarea
                  rows="5"
                  class="form-control"
                  id="contentEn"
                  th:field="*{contentEn}"
                  th:classappend="${#fields.hasErrors('contentEn')} ? 'is-invalid'"
                ></textarea>
                <div class="invalid-feedback" th:errors="*{contentEn}"></div>
              </div>
            </section>
            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                id="published"
                th:field="*{published}"
              /><label
                class="form-check-label"
                for="published"
                th:text="#{admin.publishPost}"
              ></label>
            </div>
            <div class="d-flex gap-3 mt-4">
              <button
                class="btn btn-dark"
                type="submit"
                th:text="#{action.save}"
              ></button
              ><a
                class="btn btn-outline-secondary"
                th:href="@{/admin/blog}"
                th:text="#{action.cancel}"
              ></a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
