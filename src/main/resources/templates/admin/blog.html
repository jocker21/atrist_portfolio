<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{admin.posts})}"></head>
  <body class="admin-page">
    <nav th:replace="~{fragments/site :: adminHeader}"></nav>
    <main class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="#{admin.posts}"></h1>
        <a
          class="btn btn-dark"
          th:href="@{/admin/blog/new}"
          th:text="#{admin.newPost}"
        ></a>
      </div>
      <div class="table-responsive">
        <table class="table align-middle table-hover">
          <thead>
            <tr>
              <th th:text="#{field.title}"></th>
              <th th:text="#{admin.slug}"></th>
              <th th:text="#{field.published}"></th>
              <th th:text="#{field.date}"></th>
              <th th:text="#{field.actions}"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="post : ${posts}">
              <td th:text="${@portfolioText.title(post,#locale)}"></td>
              <td><code th:text="${post.slug}"></code></td>
              <td
                th:text="${post.published} ? #{admin.yes} : #{admin.draft}"
              ></td>
              <td
                th:text="${post.publishedAt != null ? #temporals.format(post.publishedAt,'dd.MM.yyyy') : '—'}"
              ></td>
              <td>
                <div class="d-flex gap-2">
                  <a
                    class="btn btn-sm btn-outline-dark"
                    th:href="@{/admin/blog/{id}/edit(id=${post.id})}"
                    th:text="#{action.edit}"
                  ></a>
                  <form
                    method="post"
                    th:action="@{/admin/blog/{id}/delete(id=${post.id})}"
                    th:attr="data-confirm=#{confirm.post}"
                  >
                    <button
                      class="btn btn-sm btn-outline-danger"
                      type="submit"
                      th:text="#{action.delete}"
                    ></button>
                  </form>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(posts)}">
              <td
                colspan="5"
                class="text-muted py-4"
                th:text="#{admin.emptyPosts}"
              ></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
