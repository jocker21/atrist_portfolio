<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{nav.login})}"></head>
  <body>
    <header th:replace="~{fragments/site :: header('')}"></header>
    <main class="site-container section-space">
      <section class="login-form">
        <p class="eyebrow section-number" th:text="#{brand.caption}"></p>
        <h1 th:text="#{login.title}"></h1>
        <div
          th:if="${param.error}"
          class="alert alert-danger"
          role="alert"
          th:text="#{login.error}"
        ></div>
        <div
          th:if="${param.logout}"
          class="alert alert-info"
          role="status"
          th:text="#{login.logout}"
        ></div>
        <form th:action="@{/login}" method="post">
          <div class="form-field">
            <label for="username" th:text="#{field.username}"></label
            ><input
              class="form-control"
              id="username"
              name="username"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-field">
            <label for="password" th:text="#{field.password}"></label
            ><input
              class="form-control"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="button button-accent" type="submit">
            <span th:text="#{action.signin}"></span
            ><span aria-hidden="true">→</span>
          </button>
        </form>
        <a class="text-link back-link" th:href="@{/}" th:text="#{nav.site}"></a>
      </section>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
  </body>
</html>
