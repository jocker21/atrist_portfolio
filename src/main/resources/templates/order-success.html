<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{order.successTitle})}"></head>
  <body>
    <header th:replace="~{fragments/site :: header('')}"></header>
    <main class="site-container section-space">
      <section class="success-state">
        <span class="success-mark" aria-hidden="true">✓</span>
        <h1 th:text="#{order.successTitle}"></h1>
        <p th:text="#{order.success}"></p>
        <a th:href="@{/gallery}" class="button button-accent"
          ><span th:text="#{action.gallery}"></span
          ><span aria-hidden="true">→</span></a
        >
      </section>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
  </body>
</html>
