<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head
    th:replace="~{fragments/site :: head(${@portfolioText.title(post,#locale)})}"
  ></head>
  <body>
    <header th:replace="~{fragments/site :: header('blog')}"></header>
    <main class="site-container section-space">
      <article class="post-body">
        <a
          class="text-link back-link"
          th:href="@{/blog}"
          th:text="#{action.blog}"
        ></a>
        <p
          class="eyebrow section-number"
          th:text="${#temporals.format(post.publishedAt,'dd MMMM yyyy')}"
        ></p>
        <h1 th:text="${@portfolioText.title(post,#locale)}"></h1>
        <img
          th:if="${!#strings.isEmpty(post.coverImageUrl)}"
          class="post-cover"
          th:src="@{'/' + ${post.coverImageUrl}}"
          th:alt="${@portfolioText.title(post,#locale)}"
        />
        <div
          class="post-content"
          th:utext="${@portfolioText.content(post,#locale)}"
        ></div>
      </article>
    </main>
    <footer th:replace="~{fragments/site :: footer}"></footer>
  </body>
</html>
