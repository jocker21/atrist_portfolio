<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
  <head th:replace="~{fragments/site :: head(#{nav.home})}"></head>
  <body class="home-page">
    <section class="studio-hero">
      <img
        class="hero-image"
        th:src="@{/images/studio-hero-depth.png}"
        alt=""
        fetchpriority="high"
      />
      <th:block th:replace="~{fragments/site :: header('home')}"></th:block>
      <div class="site-container hero-content">
        <p class="eyebrow" th:text="#{hero.eyebrow}"></p>
        <h1>
          <span th:text="#{hero.line1}"></span><br />
          <span th:text="#{hero.line2}"></span> <em th:text="#{hero.and}"></em
          ><br />
          <span th:text="#{hero.line3}"></span>
        </h1>
        <p class="hero-description" th:text="#{hero.description}"></p>
        <a class="button button-accent" th:href="@{/gallery}"
          ><span th:text="#{hero.explore}"></span
          ><span aria-hidden="true">→</span></a
        >
      </div>
      <div class="site-container hero-bottom">
        <a href="#selected"
          ><span class="scroll-line" aria-hidden="true"></span
          ><span th:text="#{hero.scroll}"></span></a
        ><span th:text="#{hero.note}"></span>
      </div>
    </section>
    <main>
      <section id="selected" class="site-container section-space">
        <div class="section-heading">
          <div>
            <p
              class="eyebrow section-number"
              th:text="#{section.collection}"
            ></p>
            <h2 th:text="#{home.selected}"></h2>
          </div>
          <a class="text-link" th:href="@{/gallery}"
            ><span th:text="#{home.all}"></span
            ><span aria-hidden="true">↗</span></a
          >
        </div>
        <p
          th:if="${#lists.isEmpty(artworks)}"
          class="empty-state"
          th:text="#{gallery.empty}"
        ></p>
        <div class="work-grid">
          <th:block th:each="artwork : ${artworks}"
            ><article
              th:replace="~{fragments/site :: artworkCard(${artwork})}"
            ></article
          ></th:block>
        </div>
      </section>
      <section class="biography-preview">
        <div class="site-container biography-preview-inner">
          <div>
            <h2 th:text="#{nav.about}"></h2>
          </div>
          <div>
            <p
              th:text="${@artistProfileService.intro(artistProfile,#locale)}"
            ></p>
            <a class="text-link" th:href="@{/about}"
              ><span th:text="#{about.read}"></span
              ><span aria-hidden="true">↗</span></a
            >
          </div>
        </div>
      </section>
      <section class="journal-band" th:unless="${#lists.isEmpty(latestPosts)}">
        <div class="site-container section-space">
          <div class="section-heading">
            <div>
              <p
                class="eyebrow section-number"
                th:text="#{section.journal}"
              ></p>
              <h2 th:text="#{home.journal}"></h2>
            </div>
            <a class="text-link" th:href="@{/blog}"
              ><span th:text="#{home.allPosts}"></span
              ><span aria-hidden="true">↗</span></a
            >
          </div>
          <div class="journal-grid">
            <article class="journal-item" th:each="post : ${latestPosts}">
              <p
                class="work-meta"
                th:text="${#temporals.format(post.publishedAt,'dd MMMM yyyy')}"
              ></p>
              <h3>
                <a
                  th:href="@{/blog/{slug}(slug=${post.slug})}"
                  th:text="${@portfolioText.title(post,#locale)}"
                ></a>
              </h3>
              <p th:text="${@portfolioText.excerpt(post,#locale)}"></p>
              <a class="text-link" th:href="@{/blog/{slug}(slug=${post.slug})}"
                ><span th:text="#{action.read}"></span
                ><span aria-hidden="true">↗</span></a
              >
            </article>
          </div>
        </div>
      </section>
      <section class="contact-band">
        <div class="site-container">
          <p class="eyebrow" th:text="#{home.contactEyebrow}"></p>
          <h2 th:text="#{home.contactTitle}"></h2>
          <a class="button button-accent" th:href="@{/contact}"
            ><span th:text="#{footer.contact}"></span
            ><span aria-hidden="true">→</span></a
          >
        </div>
      </section>
    </main>
    <th:block th:with="hideFooterBrand=true">
      <footer th:replace="~{fragments/site :: footer}"></footer>
    </th:block>
  </body>
</html>
